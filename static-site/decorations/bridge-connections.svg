<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 900"
  aria-hidden="true"
  focusable="false"
>
  <style>
    :root {
      --bridge-primary: #164EE8;
      --bridge-secondary: #B8CAF2;
      --bridge-muted: #DCE2E6;

      --bridge-primary-opacity: 0.82;
      --bridge-secondary-opacity: 0.70;
      --bridge-muted-opacity: 0.88;
      --bridge-node-opacity: 0.92;
    }

    .bridge-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .bridge-line--primary {
      stroke: var(--bridge-primary);
      stroke-width: 1.6;
      stroke-opacity: var(--bridge-primary-opacity);
    }

    .bridge-line--secondary {
      stroke: var(--bridge-secondary);
      stroke-width: 1.3;
      stroke-opacity: var(--bridge-secondary-opacity);
    }

    .bridge-line--muted {
      stroke: var(--bridge-muted);
      stroke-width: 1.1;
      stroke-opacity: var(--bridge-muted-opacity);
    }

    .bridge-node {
      fill: #fff;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
      opacity: var(--bridge-node-opacity);
    }

    .bridge-node--primary {
      stroke: var(--bridge-primary);
    }

    .bridge-node--secondary {
      stroke: var(--bridge-secondary);
    }
  </style>

  <!--
    Bridge / Connections
    Decorative lines are concentrated along the left and top perimeter,
    leaving the central photo/content area visually quiet.
  -->

  <g>
    <path
      class="bridge-line bridge-line--muted"
      d="M 18 862
         C 88 824, 126 748, 140 650
         C 154 552, 148 440, 176 350
         C 194 292, 236 250, 300 224
         C 414 178, 550 144, 792 62"
    />

    <path
      class="bridge-line bridge-line--secondary"
      d="M 50 892
         C 112 842, 146 766, 156 666
         C 166 566, 160 450, 184 356
         C 200 296, 240 254, 302 228
         C 420 180, 558 146, 800 88"
    />

    <path
      class="bridge-line bridge-line--primary"
      d="M 0 824
         C 74 798, 112 728, 128 636
         C 144 544, 140 430, 168 342
         C 188 280, 230 240, 296 214
         C 408 170, 540 132, 772 28"
    />

    <path
      class="bridge-line bridge-line--secondary"
      d="M 84 900
         C 134 850, 164 782, 170 682
         C 176 582, 170 462, 192 366
         C 206 304, 246 260, 308 234
         C 430 184, 568 154, 800 112"
    />
  </g>

  <g>
    <circle class="bridge-node bridge-node--primary" cx="128" cy="636" r="4" />
    <circle class="bridge-node bridge-node--secondary" cx="184" cy="356" r="3.5" />
    <circle class="bridge-node bridge-node--primary" cx="302" cy="228" r="4.5" />
    <circle class="bridge-node bridge-node--secondary" cx="558" cy="146" r="3.5" />
    <circle class="bridge-node bridge-node--primary" cx="772" cy="28" r="4" />
  </g>
</svg>
